name: Build & Deploy Pages

# 触发条件：
#   - main/master 分支 push（正式发布）
#   - PR 提交时运行构建检查（不发布）
on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - 'README*'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: 20

# GITHUB_TOKEN 权限（发布 Pages 需要）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # =====================================================
  # Job 1: 构建前端产物（GitHub Pages 纯静态公共网页）
  #   - 强制开启 VITE_DEMO_MODE=true，所有 API 走 public/api-mock/*.json
  #   - 设置 base 为 /仓库名/，支持 GitHub Pages 子路径
  # =====================================================
  build:
    name: 构建前端静态站
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 清理残留 node_modules（防止 git 跟踪的旧文件权限问题）
        run: rm -rf node_modules

      - name: 安装依赖
        run: npm ci --include=dev --no-audit --no-fund

      - name: 检查 Vite 安装
        run: |
          test -f node_modules/vite/bin/vite.js
          node ./node_modules/vite/bin/vite.js --version

      - name: 构建 (GitHub Pages 子路径 + 演示模式)
        env:
          # 开启离线演示模式：所有 API 走内置 JSON mock，不依赖后端服务器
          VITE_DEMO_MODE: "true"
          # GitHub Pages 子路径 = /<仓库名>/
          # 注意：env 块不会展开 ${GITHUB_REPOSITORY#*/} 这种 shell 语法，必须使用 GitHub Actions 表达式
          VITE_BASE: "/${{ github.event.repository.name }}/"
          VITE_GITHUB_REPO: "${{ github.event.repository.name }}"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: 校验产物
        run: |
          echo "构建完成，产物目录大小："
          du -sh rebuild-dist 2>/dev/null || echo "du 不可用，跳过"
          echo "校验 GitHub Pages 资源路径："
          grep -n "${{ github.event.repository.name }}/assets" rebuild-dist/index.html
          if grep -n "GITHUB_REPOSITORY" rebuild-dist/index.html; then
            echo "错误：构建产物中仍包含未展开的 GITHUB_REPOSITORY 变量"
            exit 1
          fi
          echo "目录结构："
          ls -la rebuild-dist/

      - name: 上传 Pages 工件
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/rebuild-dist

  # =====================================================
  # Job 2: 发布到 GitHub Pages（仅 push main/master）
  # =====================================================
  deploy:
    name: 发布 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
