name: PR 构建检查

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  push:
    branches:
      - '**'
      - '!main'
      - '!master'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------- 后端：依赖安装 + 导入测试 + 数据库初始化 --------
  backend-check:
    name: 后端构建检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 数据库初始化测试
        run: python -c "from app.init_db import main; main()"

      - name: 导入检查（所有模块可 import）
        run: |
          python -c "
          from app.main import app
          from app.api.router import api_router
          from app.init_db import main
          from app.models.user import User
          from app.models.form import Form
          from app.models.monitoring import MonitoringSensor, MonitoringReading
          from app.models.alerts import AlertRule, Alert
          from app.models.geology import GeologyLayer, Borehole
          from app.models.project import Project
          from app.models.model_metric import ModelStageMetric
          print('backend imports OK, routes count:', len(api_router.routes))
          "

  # -------- 前端：lint-free 构建检查 --------
  frontend-check:
    name: 前端构建检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 清理残留 node_modules（防止 git 跟踪的旧文件权限问题）
        run: rm -rf node_modules

      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 修复二进制可执行权限
        run: chmod +x node_modules/.bin/* || true

      - name: 生产构建
        env:
          VITE_DEMO_MODE: "true"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: 校验产物
        run: |
          test -f rebuild-dist/index.html && echo "index.html OK"
          ls rebuild-dist/
