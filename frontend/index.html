<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages 子路径部署兼容：自动把 /vite.svg 变成 /仓库名/vite.svg（运行时 main.js 里会根据 BASE_URL 调整）-->
    <script>
      // 读取 Vite 注入的 import.meta.env.BASE_URL 等价变量
      window.__PROJECT_BASE__ = document.currentScript
        ? new URL('.', document.currentScript.src).pathname.replace(/\/$/, '')
        : ''
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="土石方平衡系统设计与开发 · 工程数字化协同平台（业务首页/表单审批/地质信息/监测信息/参数繁衍/安全预警/系统管理 + 三维交互）" />
    <meta name="keywords" content="土石方平衡,VTK.js,3D可视化,FastAPI,Vue3,工程数字化,古贤枢纽,监测预警,参数反演" />
    <meta name="author" content="土石方平衡系统设计与开发开源项目" />
    <title>土石方平衡系统设计与开发 · 工程数字化协同平台</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>需要启用 JavaScript 才能运行土石方平衡协同系统三维可视化模块</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
